spring.application.name=appointments
server.port=8081

services.catalog.url=${SERVICES_CATALOG_URL:http://ms-catalog:8082}

spring.datasource.url=jdbc:mysql://localhost:3306/bd_appointment?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.main.allow-bean-definition-overriding=true

# van en false solo de forma local para que no busquen al servidor de zookeeper
spring.cloud.zookeeper.enabled=false
spring.cloud.zookeeper.discovery.enabled=false
spring.cloud.zookeeper.config.enabled=false