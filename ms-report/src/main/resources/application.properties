spring.application.name=report
server.port=8083

# Base de Datos
spring.datasource.url=jdbc:mysql://${SPRING_DATASOURCE_HOST:localhost}:3307/bd_report?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.main.allow-bean-definition-overriding=true


# Configuracion de Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:172.31.77.176:9092}
spring.kafka.consumer.group-id=report-group-v2
spring.kafka.consumer.auto-offset-reset=latest

# Deserializadores con manejo de errores
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

# Configuracion del JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=report.model.AppointmentEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# Desactivar Zookeeper
spring.cloud.zookeeper.enabled=false
spring.cloud.zookeeper.config.enabled=false
spring.cloud.zookeeper.discovery.enabled=false