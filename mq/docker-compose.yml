version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: local-rabbitmq
    restart: always
    ports:
      - "5672:5672"     # AMQP para los microservicios
      - "15672:15672"   # UI web de administración
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s